<div class="page" id="page-user-manager">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;padding:20px 20px 0">
    <div>
      <h2 class="page-title" style="font-size:18px;display:flex;align-items:center;gap:8px">
        <i class="fa-solid fa-tower-broadcast" style="color:var(--accent);font-size:15px"></i>
        <span data-i18n="um_title">User Manager</span>
      </h2>
      <p style="color:var(--muted);font-size:12px;margin-top:3px" data-i18n="um_subtitle">ใครออนไลน์อยู่ตอนนี้ และทำอะไรในระบบบ้าง</p>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:7px 12px;min-width:220px">
        <i class="fa-solid fa-magnifying-glass" style="color:var(--muted);font-size:12px"></i>
        <input type="text" id="umSearchBox" placeholder="ค้นหาผู้ใช้ / username" data-i18n-placeholder="um_search_placeholder"
          style="background:none;border:none;outline:none;color:var(--text);font-size:12.5px;width:100%">
      </div>
      <div style="display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--border);border-radius:100px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted)">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(106,191,123,.18)"></span>
        <span id="umClock">--:--:--</span>
      </div>
      <button class="btn btn-sm" style="background:var(--surface2);border:1px solid var(--border);color:var(--text)" onclick="refreshUserManagerConsole()">
        <i class="fa-solid fa-rotate"></i> <span data-i18n="um_refresh">รีเฟรช</span>
      </button>
    </div>
  </div>

  <!-- ═══ STAT CARDS ═══ -->
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:16px 20px 0">
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);padding:14px 16px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:var(--ok)"></div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px" data-i18n="um_stat_online">🟢 ออนไลน์ตอนนี้</div>
      <div id="umStatOnline" style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700">0</div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);padding:14px 16px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:var(--info)"></div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px" data-i18n="um_stat_total">👥 ผู้ใช้ทั้งหมด</div>
      <div id="umStatTotal" style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700">0</div>
      <div id="umStatTotalSub" style="font-size:10.5px;color:var(--muted);margin-top:4px;font-family:'JetBrains Mono',monospace"></div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);padding:14px 16px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:var(--warn)"></div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px" data-i18n="um_stat_idle">⏱ ไม่มีการใช้งาน (&gt;3 นาที)</div>
      <div id="umStatIdle" style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700">0</div>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);padding:14px 16px;position:relative;overflow:hidden">
      <div style="position:absolute;top:0;left:0;width:3px;height:100%;background:var(--danger)"></div>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:8px" data-i18n="um_stat_failed">⚠ ล็อกอินล้มเหลว (24 ชม.)</div>
      <div id="umStatFailed" style="font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700">0</div>
    </div>
  </div>

  <!-- ═══ ONLINE LIST + ACTIVITY FEED ═══ -->
  <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:14px;padding:16px 20px 0" id="umTwoCol">
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)">
        <div style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px">
          🟢 <span data-i18n="um_panel_online">กำลังใช้งานอยู่</span>
          <span id="umOnlineCountBadge" style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ok);background:rgba(106,191,123,.12);padding:2px 8px;border-radius:100px">0</span>
        </div>
      </div>
      <div id="umOnlineList" style="max-height:400px;overflow-y:auto"></div>
    </div>

    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border)">
        <div style="font-size:13px;font-weight:700" data-i18n="um_panel_activity">กิจกรรมล่าสุด</div>
        <span style="font-size:11px;color:var(--muted);cursor:pointer" onclick="switchPage('log')" data-i18n="um_view_full_log">ดูทั้งหมด →</span>
      </div>
      <div id="umActivityFeed" style="max-height:400px;overflow-y:auto"></div>
    </div>
  </div>

  <!-- ═══ USERS TABLE ═══ -->
  <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;margin:16px 20px 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap" id="umFilterPills">
        <button class="um-pill active" data-f="all" data-i18n="um_filter_all">ทั้งหมด</button>
        <button class="um-pill" data-f="online" data-i18n="um_filter_online">ออนไลน์</button>
        <button class="um-pill" data-f="idle" data-i18n="um_filter_idle">Idle</button>
        <button class="um-pill" data-f="suspended" data-i18n="um_filter_suspended">ปิดใช้งาน</button>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openUserModal()"><i class="fa-solid fa-plus"></i> <span data-i18n="btn_add_user">เพิ่มผู้ใช้</span></button>
    </div>
    <div class="emp-table-wrap">
      <table>
        <thead><tr>
          <th data-i18n="um_col_user">ผู้ใช้</th>
          <th data-i18n="um_col_role">บทบาท</th>
          <th data-i18n="um_col_status">สถานะ</th>
          <th data-i18n="um_col_last_login">เข้าสู่ระบบล่าสุด</th>
          <th data-i18n="um_col_sessions">เซสชัน</th>
          <th></th>
        </tr></thead>
        <tbody id="umTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .um-pill {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 12px;
    border-radius: 100px; border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); cursor: pointer; transition: all var(--tr);
  }
  .um-pill.active { background: var(--a1d); border-color: rgba(98,196,176,.3); color: var(--accent); }
  .um-pill:hover:not(.active) { border-color: var(--b1, var(--border)); color: var(--text); }
  .um-online-row {
    display: flex; align-items: center; gap: 11px; padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .um-online-row:last-child { border-bottom: none; }
  .um-online-row:hover { background: var(--surface3, var(--bg3)); }
  .um-presence-pip {
    position: absolute; bottom: -1px; right: -1px; width: 9px; height: 9px;
    border-radius: 50%; border: 2px solid var(--surface2);
  }
  .um-feed-item { display: flex; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .um-feed-item:last-child { border-bottom: none; }
  .um-feed-icon {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px; margin-top: 1px;
  }
  .role-hr { background: rgba(107,159,212,.15); color: var(--info); border: 1px solid rgba(107,159,212,.3); }
</style>
